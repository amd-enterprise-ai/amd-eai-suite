# Common repo-wide hooks (whitespace, copyright, shellcheck, prettier, mypy).
# App-specific hooks live in per-app configs under apps/*/ (prek workspace mode with orphan: true).

repos:
  - repo: local
    hooks:
      - id: ai-rules-sync
        name: AI Rules Sync
        description: Ensure CLAUDE.md symlinks and generated files are up to date
        entry: make ai-rules
        language: system
        files: ^(.*AGENTS\.md|.*CLAUDE\.md|\.github/copilot-instructions\.md|\.github/instructions/.*)$
        pass_filenames: false
      - id: copyright-check
        name: AMD Copyright Check
        description: Check that all files have the required AMD copyright
        entry: tooling/check_copyright.py --fix
        language: python
        pass_filenames: true
        always_run: false
        exclude: ^(sbom\.json|THIRD-PARTY-NOTICES\.md)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(apps/api/workloads_manager/workloads_manager/data/patches|packages/workloads_manager/workloads_manager/data/patches|sbom\.json|THIRD-PARTY-NOTICES\.md)
      - id: end-of-file-fixer
        exclude: ^(sbom\.json|THIRD-PARTY-NOTICES\.md)$
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.1
    hooks:
      - id: prettier
        args: ["--write", "--config", ".prettierrc"]
        exclude: ^(apps/ui|docs|helm/.*.yaml|.github/workflows/.*.yml|apps/api/.*/specs/test_workloads|sbom\.json|THIRD-PARTY-NOTICES\.md)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        additional_dependencies:
          [
            types-redis,
            types-PyYAML,
            types-requests,
            types-tabulate,
            types-docker,
          ]
        args: ["--config-file=pyproject.toml"]
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
