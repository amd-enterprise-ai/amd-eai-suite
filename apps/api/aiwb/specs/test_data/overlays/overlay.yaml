# Simple overlay for E2E testing of overlay CRUD operations
replicaCount: 1
resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "1"
    memory: "2Gi"
env:
  - name: TEST_VAR
    value: "original"
