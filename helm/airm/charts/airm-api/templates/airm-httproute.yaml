---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Release.Name }}api-route'
  namespace: '{{ .Release.Namespace }}'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ coalesce .Values.kgateway.gatewayName .Values.gateway.gatewayName }}
      namespace: {{ coalesce .Values.kgateway.namespace .Values.gateway.namespace }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: '{{ .Release.Name }}-api'
          port: {{ .Values.gateway.airmapi.servicePort }}
          weight: 1
      matches:
        - headers:
            - name: Host
              type: RegularExpression
              value: {{ .Values.gateway.airmapi.prefixValue }}\..*
          path:
            type: RegularExpression
            value: .*/stream.*
      timeouts:
        backendRequest: {{ .Values.gateway.airmapi.timeouts.stream.backendRequest }}
        request: {{ .Values.gateway.airmapi.timeouts.stream.request }}
    - backendRefs:
        - group: ""
          kind: Service
          name: '{{ .Release.Name }}-api'
          port: {{ .Values.gateway.airmapi.servicePort }}
          weight: 1
      matches:
        - headers:
            - name: Host
              type: RegularExpression
              value: {{ .Values.gateway.airmapi.prefixValue }}\..*
          path:
            type: PathPrefix
            value: /
      timeouts:
        backendRequest: {{ .Values.gateway.airmapi.timeouts.nonStream.backendRequest }}
        request: {{ .Values.gateway.airmapi.timeouts.nonStream.request }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Release.Name }}ui-route'
  namespace: '{{ .Release.Namespace }}'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ coalesce .Values.kgateway.gatewayName .Values.gateway.gatewayName }}
      namespace: {{ coalesce .Values.kgateway.namespace .Values.gateway.namespace }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: '{{ .Release.Name }}-ui'
          port: {{ .Values.gateway.airmui.servicePort }}
          weight: 1
      matches:
        - headers:
            - name: Host
              type: RegularExpression
              value: {{ .Values.gateway.airmui.prefixValue }}\..*
          path:
            type: PathPrefix
            value: /
      timeouts:
        backendRequest: {{ .Values.gateway.airmui.timeouts.backendRequest }}
        request: {{ .Values.gateway.airmui.timeouts.request }}
