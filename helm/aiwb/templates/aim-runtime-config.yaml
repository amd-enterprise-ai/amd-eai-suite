# Cluster-scoped AIMClusterRuntimeConfig - always created by this chart.
# Named "default" so the AIM operator applies it automatically to all
# AIMServices, including those created via kubectl without an explicit
# runtimeConfigName.
---
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMClusterRuntimeConfig
metadata:
  name: {{ .Values.aim.clusterRuntimeConfigName }}
  labels:
    {{- include "aiwb.labels" . | nindent 4 }}
spec:
  pvcHeadroomPercent: {{ .Values.aim.pvcHeadroomPercent }}
  labelPropagation:
    enabled: true
    match:
      - "{{ .Values.metadataPrefix.eaiApps }}/*"
  routing:
    enabled: {{ .Values.aim.routing.enabled }}
    gatewayRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ coalesce .Values.kgateway.gatewayName .Values.gateway.gatewayName }}
      namespace: {{ coalesce .Values.kgateway.namespace .Values.gateway.namespace }}
    # Pin routes to a single listener hostname so they don't attach to every
    # listener on the gateway (which would expose the service on listeners that
    # do not enforce inference auth). Defaults to the workloads host
    # (workloads.<appDomain>) when aim.routing.hostnames is unset.
    hostnames:
      {{- $hostnames := .Values.aim.routing.hostnames | default (list (printf "workloads.%s" .Values.appDomain)) }}
      {{- range $hostnames }}
      - {{ . | quote }}
      {{- end }}
    pathTemplate: "{.metadata.namespace}/{.metadata.labels['{{ .Values.metadataPrefix.eaiApps }}/workload-id']}"
    requestTimeout: {{ .Values.aim.routing.requestTimeout }}
